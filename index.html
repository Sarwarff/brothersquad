<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brother Squad</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:ital,wght@1,800;1,900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-pure: #030008;
            --card-bg: rgba(10, 7, 20, 0.9);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* AMBIENT BACKGROUND GLOW */
        .ambient-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(6, 182, 212, 0.08) 45%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
            animation: ambientMove 8s ease-in-out infinite alternate;
        }

        @keyframes ambientMove {
            0% { transform: scale(0.9) translate(-20px, -20px); }
            100% { transform: scale(1.2) translate(20px, 20px); }
        }

        /* ---------------------------------------------------- */
        /* INTRO: "BROTHER SQUAD" BOLD ITALIC + LIGHT SLASH    */
        /* ---------------------------------------------------- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-pure);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        .slash-container {
            position: relative;
            display: inline-block;
            overflow: hidden;
            padding: 15px 30px;
        }

        .intro-text {
            font-family: 'Orbitron', sans-serif;
            font-style: italic;
            font-weight: 900;
            font-size: clamp(2rem, 7vw, 2.9rem);
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 15%, #c084fc 60%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.6));
        }

        .light-slash {
            position: absolute;
            top: 0;
            left: -130%;
            width: 70%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(56, 189, 248, 0.4) 30%, 
                rgba(255, 255, 255, 1) 50%, 
                rgba(192, 132, 252, 0.5) 70%, 
                transparent 100%
            );
            transform: skewX(-32deg);
            animation: lightSlashAnim 2.4s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        @keyframes lightSlashAnim {
            0% { left: -130%; }
            45% { left: 140%; }
            100% { left: 140%; }
        }

        /* ---------------------------------------------------- */
        /* NEON BORDER INTERFACE CARD                          */
        /* ---------------------------------------------------- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 410px;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Multi-color shifting glowing edge */
        .card-glow-border {
            width: 100%;
            position: relative;
            padding: 2px;
            border-radius: 30px;
            background: linear-gradient(120deg, #8b5cf6, #06b6d4, #f43f5e, #10b981, #f59e0b, #8b5cf6);
            background-size: 300% 300%;
            animation: neonBorderShift 7s linear infinite;
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.35);
        }

        @keyframes neonBorderShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 28px;
            padding: 34px 26px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9) inset;
        }

        /* VIEW SWITCHER ANIMATIONS */
        .view-section {
            opacity: 0;
            transform: scale(0.96) translateY(10px);
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            padding: inherit;
        }

        .view-section.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            position: relative;
        }

        /* ---------------------------------------------------- */
        /* LOGIN FORM & DIVERSE COLOR GLOWING FIELDS            */
        /* ---------------------------------------------------- */
        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #c4b5fd;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* USERNAME WITH DYNAMIC SHIFTING GLOW */
        .user-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 13px 16px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.35s ease;
        }

        .user-field:focus {
            background: rgba(139, 92, 246, 0.06);
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.45);
            color: #e9d5ff;
        }

        /* 6-BOX PIN GRID WITH DIFFERENT VIBRANT COLORS */
        .pin-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 4px;
        }

        .pin-box {
            width: 100%;
            height: 52px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 13px;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Box 1: Cyan */
        .pin-box:nth-child(1):focus {
            border-color: #06b6d4;
            background: rgba(6, 182, 212, 0.08);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            color: #06b6d4;
            transform: translateY(-2px);
        }
        /* Box 2: Purple */
        .pin-box:nth-child(2):focus {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
            color: #8b5cf6;
            transform: translateY(-2px);
        }
        /* Box 3: Emerald */
        .pin-box:nth-child(3):focus {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
            color: #10b981;
            transform: translateY(-2px);
        }
        /* Box 4: Amber */
        .pin-box:nth-child(4):focus {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.08);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
            color: #f59e0b;
            transform: translateY(-2px);
        }
        /* Box 5: Rose */
        .pin-box:nth-child(5):focus {
            border-color: #f43f5e;
            background: rgba(244, 63, 94, 0.08);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.6);
            color: #f43f5e;
            transform: translateY(-2px);
        }
        /* Box 6: Electric Blue */
        .pin-box:nth-child(6):focus {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.08);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            color: #3b82f6;
            transform: translateY(-2px);
        }

        .error-msg {
            color: #f43f5e;
            font-size: 11.5px;
            font-weight: 700;
            text-align: center;
            margin-top: 10px;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.3s ease;
        }

        .error-msg.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ACCESS BUTTON */
        .access-btn {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease;
        }

        .access-btn:hover {
            box-shadow: 0 12px 32px rgba(139, 92, 246, 0.6);
            transform: translateY(-1px);
        }

        .access-btn:active {
            transform: scale(0.98);
        }

        /* ---------------------------------------------------- */
        /* PREMIUM LOADING SCANNER VIEW                         */
        /* ---------------------------------------------------- */
        .loader-wrapper {
            text-align: center;
            padding: 30px 0;
        }

        .scanner-ring {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border: 3px solid rgba(139, 92, 246, 0.15);
            border-top: 3px solid #06b6d4;
            border-right: 3px solid #8b5cf6;
            border-radius: 50%;
            animation: spinLoader 0.85s linear infinite;
            filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.7));
        }

        @keyframes spinLoader {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #c4b5fd;
            animation: pulseText 1.2s ease-in-out infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* ---------------------------------------------------- */
        /* PERFECT REPEATING CHECKMARK & ORBITING HALO          */
        /* ---------------------------------------------------- */
        .success-wrapper {
            text-align: center;
            padding: 15px 0 10px;
        }

        .halo-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .svg-halo {
            position: absolute;
            width: 90px;
            height: 90px;
            transform: rotate(-90deg);
        }

        .halo-track {
            fill: none;
            stroke: rgba(16, 185, 129, 0.12);
            stroke-width: 4;
        }

        /* Continuous rotating line that glows & touches circle end */
        .halo-orbit {
            fill: none;
            stroke: var(--success);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 260;
            stroke-dashoffset: 260;
            filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.9));
            animation: haloLoop 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes haloLoop {
            0% {
                stroke-dashoffset: 260;
                transform: rotate(0deg);
                opacity: 0.2;
            }
            45% {
                stroke-dashoffset: 0;
                transform: rotate(360deg);
                opacity: 1;
            }
            75% {
                opacity: 1;
            }
            100% {
                stroke-dashoffset: -260;
                transform: rotate(720deg);
                opacity: 0.2;
            }
        }

        .svg-checkmark {
            width: 42px;
            height: 42px;
            stroke: #10b981;
            stroke-width: 3.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.8));
            animation: checkmarkDrawLoop 3s ease-in-out infinite;
        }

        /* Draws from start of the line to the end, glows, fades, and repeats */
        @keyframes checkmarkDrawLoop {
            0% {
                stroke-dashoffset: 60;
                opacity: 0;
                transform: scale(0.85);
            }
            20% {
                opacity: 1;
            }
            45%, 75% {
                stroke-dashoffset: 0;
                opacity: 1;
                transform: scale(1);
            }
            95%, 100% {
                stroke-dashoffset: 0;
                opacity: 0;
                transform: scale(0.95);
            }
        }

        .success-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .success-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Light -->
    <div class="ambient-glow"></div>

    <!-- 1. INTRO SCREEN -->
    <div id="intro-screen">
        <div class="slash-container">
            <h1 class="intro-text">Brother Squad</h1>
            <div class="light-slash"></div>
        </div>
    </div>

    <!-- 2. MAIN CONTAINER -->
    <div class="app-container">
        <div class="card-glow-border">
            <div class="card">

                <!-- SECTION 1: LOGIN -->
                <div class="view-section active" id="sec-login">
                    <div class="card-header">
                        <div class="badge-pill">
                            <div class="badge-dot"></div>
                            Terminal Access
                        </div>
                        <h2 class="title">Sign In</h2>
                    </div>

                    <!-- Username -->
                    <div class="input-group">
                        <label class="input-label">Enter Username</label>
                        <input type="text" id="username" class="user-field" placeholder="Username" autocomplete="off" spellcheck="false">
                    </div>

                    <!-- 6-Box Password -->
                    <div class="input-group">
                        <label class="input-label">Password (6-Digit PIN)</label>
                        <div class="pin-grid" id="pinGrid">
                            <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                            <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                            <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                            <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                            <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                            <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                        </div>
                        <div class="error-msg" id="errorMsg">Invalid credentials</div>
                    </div>

                    <!-- Access Button -->
                    <button type="button" class="access-btn" id="btnAccess">Access</button>
                </div>

                <!-- SECTION 2: SCANNING / LOADING -->
                <div class="view-section" id="sec-loading">
                    <div class="loader-wrapper">
                        <div class="scanner-ring"></div>
                        <div class="loading-text">Verifying Credentials...</div>
                    </div>
                </div>

                <!-- SECTION 3: SUCCESS CHECKMARK LOOP -->
                <div class="view-section" id="sec-success">
                    <div class="success-wrapper">
                        <div class="halo-container">
                            <svg class="svg-halo" viewBox="0 0 90 90">
                                <circle class="halo-track" cx="45" cy="45" r="40" />
                                <circle class="halo-orbit" cx="45" cy="45" r="40" />
                            </svg>
                            <svg class="svg-checkmark" viewBox="0 0 24 24">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <h3 class="success-title">Successfully Accessed</h3>
                        <p class="success-subtitle">Welcome back, Saad.</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // 1. Initialize Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
