<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brother Squad</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-pure: #030008;
            --card-bg: rgba(14, 10, 24, 0.75);
            --border-glow: rgba(139, 92, 246, 0.2);
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* AMBIENT BACKGROUND GLOW */
        .ambient-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(6, 182, 212, 0.05) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9) translate(-10px, -10px); opacity: 0.5; }
            100% { transform: scale(1.15) translate(10px, 10px); opacity: 0.9; }
        }

        /* ---------------------------------------------------- */
        /* INTRO: LIGHT-SLASH ANIMATION                         */
        /* ---------------------------------------------------- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-pure);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        .slash-container {
            position: relative;
            display: inline-block;
            overflow: hidden;
            padding: 10px 20px;
        }

        .intro-text {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            position: relative;
        }

        /* The moving light blade */
        .light-slash {
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(6, 182, 212, 0.3) 30%, 
                rgba(255, 255, 255, 0.95) 50%, 
                rgba(139, 92, 246, 0.4) 70%, 
                transparent 100%
            );
            transform: skewX(-28deg);
            animation: lightSlashAnim 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes lightSlashAnim {
            0% { left: -120%; }
            50% { left: 140%; }
            100% { left: 140%; }
        }

        /* ---------------------------------------------------- */
        /* MAIN CONTAINER (CENTERED & PERFECT SIZE)             */
        /* ---------------------------------------------------- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 390px;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            padding: 34px 26px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(139, 92, 246, 0.08);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* SCREEN SWITCHING TRANSITIONS */
        .view-section {
            opacity: 0;
            transform: scale(0.96) translateY(8px);
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            padding: inherit;
        }

        .view-section.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            position: relative;
        }

        /* ---------------------------------------------------- */
        /* LOGIN FORM ELEMENTS                                  */
        /* ---------------------------------------------------- */
        .card-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c4b5fd;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-label {
            display: block;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* USERNAME FIELD */
        .user-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .user-field:focus {
            background: rgba(139, 92, 246, 0.06);
            border-color: var(--accent-purple);
            box-shadow: 0 0 18px rgba(139, 92, 246, 0.3);
        }

        /* 5-BOX PIN PASSWORD */
        .pin-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 9px;
            margin-top: 4px;
        }

        .pin-box {
            width: 100%;
            height: 52px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 13px;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            outline: none;
            caret-color: var(--accent-cyan);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pin-box:focus {
            background: rgba(6, 182, 212, 0.08);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 18px rgba(6, 182, 212, 0.35);
            transform: translateY(-2px);
        }

        /* Error Text */
        .error-msg {
            color: #f43f5e;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            margin-top: 10px;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.3s ease;
        }

        .error-msg.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ACCESS BUTTON */
        .access-btn {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            background: linear-gradient(135deg, var(--accent-purple), #6366f1);
            color: #ffffff;
            border: none;
            border-radius: 15px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.35);
            transition: all 0.3s ease;
        }

        .access-btn:hover {
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.55);
            transform: translateY(-1px);
        }

        .access-btn:active {
            transform: scale(0.98);
        }

        /* ---------------------------------------------------- */
        /* SUCCESS SCREEN & SPINNING CHECKMARK ANIMATION        */
        /* ---------------------------------------------------- */
        .success-wrapper {
            text-align: center;
            padding: 15px 0 10px;
        }

        .checkmark-spinner-box {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .svg-circle {
            width: 80px;
            height: 80px;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: rgba(16, 185, 129, 0.15);
            stroke-width: 4;
        }

        .circle-bar {
            fill: none;
            stroke: var(--success);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 232;
            stroke-dashoffset: 232;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.8));
        }

        /* Spinning and completing circle */
        .animate-circle {
            animation: spinAndDrawCircle 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes spinAndDrawCircle {
            0% {
                stroke-dashoffset: 232;
                transform: rotate(0deg);
            }
            70% {
                stroke-dashoffset: 20;
            }
            100% {
                stroke-dashoffset: 0;
                transform: rotate(360deg);
            }
        }

        .svg-check {
            position: absolute;
            width: 36px;
            height: 36px;
            stroke: #ffffff;
            stroke-width: 3.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.4);
        }

        .animate-check {
            opacity: 1;
            transform: scale(1);
            animation: drawCheck 0.5s ease 0.85s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        .success-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.5s ease 0.9s;
        }

        .success-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.5s ease 1s;
        }

        .show-text {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body>

    <!-- Ambient glowing light -->
    <div class="ambient-glow"></div>

    <!-- 1. INTRO SCREEN -->
    <div id="intro-screen">
        <div class="slash-container">
            <h1 class="intro-text">Brother Squad</h1>
            <div class="light-slash"></div>
        </div>
    </div>

    <!-- 2. MAIN CONTAINER -->
    <div class="app-container">
        <div class="card">

            <!-- SECTION A: LOGIN -->
            <div class="view-section active" id="sec-login">
                <div class="card-header">
                    <div class="badge-pill">
                        <div class="badge-dot"></div>
                        Terminal Access
                    </div>
                    <h2 class="title">Sign In</h2>
                </div>

                <!-- Username Input -->
                <div class="input-group">
                    <label class="input-label">Enter Username</label>
                    <input type="text" id="username" class="user-field" placeholder="Username" autocomplete="off" spellcheck="false">
                </div>

                <!-- 5-Box Password -->
                <div class="input-group">
                    <label class="input-label">Password (5-Digit Key)</label>
                    <div class="pin-grid" id="pinGrid">
                        <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                        <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                        <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                        <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                        <input type="text" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                    </div>
                    <div class="error-msg" id="errorMsg">Invalid credentials</div>
                </div>

                <!-- Access Button -->
                <button type="button" class="access-btn" id="btnAccess">Access</button>
            </div>

            <!-- SECTION B: SUCCESS CHECKMARK -->
            <div class="view-section" id="sec-success">
                <div class="success-wrapper">
                    <div class="checkmark-spinner-box">
                        <svg class="svg-circle" viewBox="0 0 80 80">
                            <circle class="circle-bg" cx="40" cy="40" r="37" />
                            <circle class="circle-bar" id="spinnerCircle" cx="40" cy="40" r="37" />
                        </svg>
                        <svg class="svg-check" id="svgCheck" viewBox="0 0 24 24">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <h3 class="success-title" id="succTitle">Successfully Accessed</h3>
                    <p class="success-subtitle" id="succSub">Welcome back, brother.</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. Initialize Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // 2. Handle Intro Screen Timing (2.4 seconds)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.visibility = 'hidden';
                }, 800);
            }, 2400);
        });

        // 3. 5-Digit Pin Behavior & Instant Dot Transformation
        const pinInputs = Array.from(document.querySelectorAll('.pin-box'));
        const pinValues = ["", "", "", "", ""];

        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');

                if (val) {
                    const char = val.slice(-1);
                    pinValues[index] = char;
                    input.value = char;

                    // Automatically fade into dot after 350ms
                    setTimeout(() => {
                        if (pinValues[index] !== "") {
                            input.value = "•";
                        }
                    }, 350);

                    // Move to next box
                    if (index < pinInputs.length - 1) {
                        pinInputs[index + 1].focus();
                    }
                } else {
                    pinValues[index] = "";
                    input.value = "";
                }
            });

            // Handle Backspace navigation
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (input.value === "" && index > 0) {
                        pinInputs[index - 1].focus();
                        pinInputs[index - 1].value = "";
                        pinValues[index - 1] = "";
                    } else {
                        input.value = "";
                        pinValues[index] = "";
                    }
                }
            });

            // Auto-select on focus
            input.addEventListener('focus', () => {
                if (input.value === "•") {
                    input.select();
                }
            });
        });

        // 4. Access Button Handler & Transitions
        const btnAccess = document.getElementById('btnAccess');
        const usernameInput = document.getElementById('username');
        const errorMsg = document.getElementById('errorMsg');

        btnAccess.addEventListener('click', () => {
            const enteredUser = usernameInput.value.trim();
            const enteredPass = pinValues.join('');

            // Example authorized credentials (Case-insensitive user check)
            // You can replace these or hook into your database later
            if (enteredUser.length > 0 && enteredPass.length === 5) {
                errorMsg.classList.remove('visible');

                // Fade out login screen
                document.getElementById('sec-login').classList.remove('active');

                // Activate success screen
                setTimeout(() => {
                    document.getElementById('sec-success').classList.add('active');

                    // Start circular checkmark spin animation
                    document.getElementById('spinnerCircle').classList.add('animate-circle');
                    document.getElementById('svgCheck').classList.add('animate-check');
                    document.getElementById('succTitle').classList.add('show-text');
                    document.getElementById('succSub').classList.add('show-text');
                }, 300);

            } else {
                errorMsg.innerText = enteredPass.length < 5 ? "Enter all 5 digits" : "Invalid credentials";
                errorMsg.classList.add('visible');
            }
        });
    </script>
</body>
                                                 </html>
