<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brother Squad</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:ital,wght@1,900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
        body { background:#030008; color:#fff; min-height:100vh; min-height:100dvh; display:flex; justify-content:center; align-items:center; overflow:hidden; }

        /* 1. INTRO SCREEN */
        #intro { position:fixed; inset:0; background:#030008; z-index:100; display:flex; justify-content:center; align-items:center; transition:0.6s ease; }
        .intro-box { position:relative; overflow:hidden; padding:10px 20px; }
        .intro-title { font-family:'Orbitron',sans-serif; font-style:italic; font-size:clamp(1.8rem, 6vw, 2.5rem); letter-spacing:4px; background:linear-gradient(135deg,#fff,#a855f7,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 20px rgba(168,85,247,0.5)); }
        .slash { position:absolute; top:0; left:-120%; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.9),transparent); transform:skewX(-30deg); animation:slashAnim 2s forwards; }
        @keyframes slashAnim { 0%{left:-120%} 50%,100%{left:140%} }

        /* 2. CARD WRAPPER */
        .wrapper { width:100%; max-width:380px; padding:16px; position:relative; }
        .card { background:rgba(12,8,24,0.9); border-radius:24px; padding:30px 22px; position:relative; box-shadow:0 0 35px rgba(139,92,246,0.25); border:1.5px solid transparent; background-clip:padding-box; }
        .card::before { content:''; position:absolute; inset:-2px; z-index:-1; border-radius:26px; background:linear-gradient(120deg,#8b5cf6,#06b6d4,#f43f5e,#10b981,#8b5cf6); background-size:300% 300%; animation:borderAnim 6s linear infinite; }
        @keyframes borderAnim { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .view { display:none; text-align:center; animation:fadeIn 0.4s ease; }
        .view.active { display:block; }
        @keyframes fadeIn { from{opacity:0; transform:scale(0.96)} to{opacity:1; transform:scale(1)} }

        /* 3. INPUTS & MULTI-COLOR PIN GLOW */
        .badge { display:inline-block; font-size:10px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:#c4b5fd; background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.4); padding:4px 12px; border-radius:20px; margin-bottom:15px; }
        h2 { font-size:1.3rem; margin-bottom:20px; }
        .group { text-align:left; margin-bottom:16px; }
        label { display:block; font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase; margin-bottom:6px; }
        
        .user-in { width:100%; padding:12px 14px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:12px; color:#fff; font-size:0.95rem; font-weight:600; outline:none; transition:0.3s; }
        .user-in:focus { border-color:#8b5cf6; box-shadow:0 0 15px rgba(139,92,246,0.4); }

        .pin-grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; }
        .pin { width:100%; height:48px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; text-align:center; font-size:1.25rem; font-weight:800; color:#fff; outline:none; transition:0.25s; }
        
        /* Individual Pin Glows */
        .pin:nth-child(1):focus { border-color:#06b6d4; box-shadow:0 0 15px rgba(6,182,212,0.6); }
        .pin:nth-child(2):focus { border-color:#8b5cf6; box-shadow:0 0 15px rgba(139,92,246,0.6); }
        .pin:nth-child(3):focus { border-color:#10b981; box-shadow:0 0 15px rgba(16,185,129,0.6); }
        .pin:nth-child(4):focus { border-color:#f59e0b; box-shadow:0 0 15px rgba(245,158,11,0.6); }
        .pin:nth-child(5):focus { border-color:#f43f5e; box-shadow:0 0 15px rgba(244,63,94,0.6); }
        .pin:nth-child(6):focus { border-color:#3b82f6; box-shadow:0 0 15px rgba(59,130,246,0.6); }

        .err { color:#f43f5e; font-size:11px; font-weight:700; margin-top:8px; display:none; }

        .btn { width:100%; padding:13px; margin-top:10px; background:linear-gradient(135deg,#8b5cf6,#6366f1); color:#fff; border:none; border-radius:12px; font-weight:800; font-size:0.9rem; letter-spacing:1px; cursor:pointer; box-shadow:0 8px 20px rgba(139,92,246,0.35); transition:0.2s; }
        .btn:active { transform:scale(0.98); }

        /* 4. SUCCESS & LOOPING CHECKMARK */
        .halo-box { position:relative; width:80px; height:80px; margin:10px auto 16px; display:flex; align-items:center; justify-content:center; }
        .svg-halo { position:absolute; width:100%; height:100%; transform:rotate(-90deg); }
        .halo-track { fill:none; stroke:rgba(16,185,129,0.15); stroke-width:4; }
        .halo-orbit { fill:none; stroke:#10b981; stroke-width:4; stroke-linecap:round; stroke-dasharray:230; animation:haloLoop 2.8s ease-in-out infinite; filter:drop-shadow(0 0 10px rgba(16,185,129,0.8)); }
        @keyframes haloLoop { 0%{stroke-dashoffset:230; transform:rotate(0deg); opacity:0.3} 50%{stroke-dashoffset:0; transform:rotate(360deg); opacity:1} 100%{stroke-dashoffset:-230; transform:rotate(720deg); opacity:0.3} }

        .svg-check { width:38px; height:38px; stroke:#10b981; stroke-width:3.5; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:50; filter:drop-shadow(0 0 8px rgba(16,185,129,0.7)); animation:checkLoop 2.8s ease-in-out infinite; }
        @keyframes checkLoop { 0%,15%{stroke-dashoffset:50; opacity:0} 45%,80%{stroke-dashoffset:0; opacity:1} 95%,100%{stroke-dashoffset:0; opacity:0} }
    </style>
</head>
<body>

    <!-- INTRO -->
    <div id="intro">
        <div class="intro-box">
            <h1 class="intro-title">Brother Squad</h1>
            <div class="slash"></div>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div class="wrapper">
        <div class="card">
            
            <!-- LOGIN VIEW -->
            <div class="view active" id="vLogin">
                <div class="badge">Terminal Access</div>
                <h2>Sign In</h2>
                <div class="group">
                    <label>Enter Username</label>
                    <input type="text" id="user" class="user-in" placeholder="Username" autocomplete="off">
                </div>
                <div class="group">
                    <label>Password (6-Digit PIN)</label>
                    <div class="pin-grid">
                        <input type="text" class="pin" maxlength="1" inputmode="numeric">
                        <input type="text" class="pin" maxlength="1" inputmode="numeric">
                        <input type="text" class="pin" maxlength="1" inputmode="numeric">
                        <input type="text" class="pin" maxlength="1" inputmode="numeric">
                        <input type="text" class="pin" maxlength="1" inputmode="numeric">
                        <input type="text" class="pin" maxlength="1" inputmode="numeric">
                    </div>
                    <div class="err" id="errMsg">Invalid credentials.</div>
                </div>
                <button class="btn" id="btnAccess">Access</button>
            </div>

            <!-- SUCCESS VIEW -->
            <div class="view" id="vSuccess">
                <div class="halo-box">
                    <svg class="svg-halo" viewBox="0 0 80 80">
                        <circle class="halo-track" cx="40" cy="40" r="35" />
                        <circle class="halo-orbit" cx="40" cy="40" r="35" />
                    </svg>
                    <svg class="svg-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h2 style="margin-bottom:6px;">Successfully Accessed</h2>
                <p style="color:#64748b; font-size:0.9rem;">Welcome back, Saad.</p>
            </div>

        </div>
    </div>

    <script>
        // 1. Telegram SDK Init & Intro Timer
        if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
        setTimeout(() => { document.getElementById('intro').style.opacity = '0'; setTimeout(() => document.getElementById('intro').remove(), 600); }, 2200);

        // 2. PIN Boxes & Auto-Dot Handler
        const pins = document.querySelectorAll('.pin');
        const pinVals = Array(6).fill('');

        pins.forEach((input, i) => {
            input.oninput = (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '').slice(-1);
                pinVals[i] = val;
                input.value = val;
                if (val) {
                    setTimeout(() => { if(pinVals[i]) input.value = '•'; }, 300);
                    if (i < 5) pins[i + 1].focus();
                }
            };
            input.onkeydown = (e) => {
                if (e.key === 'Backspace' && !input.value && i > 0) {
                    pins[i - 1].focus();
                    pins[i - 1].value = '';
                    pinVals[i - 1] = '';
                }
            };
        });

        // 3. Login Verification (Username: Saad, Password: 123456)
        document.getElementById('btnAccess').onclick = () => {
            const u = document.getElementById('user').value.trim();
            const p = pinVals.join('');
            const err = document.getElementById('errMsg');

            if (u.toLowerCase() === 'saad' && p === '123456') {
                err.style.display = 'none';
                document.getElementById('vLogin').classList.remove('active');
                setTimeout(() => document.getElementById('vSuccess').classList.add('active'), 200);
            } else {
                err.innerText = p.length < 6 ? 'Please enter all 6 digits.' : 'Invalid username or password.';
                err.style.display = 'block';
            }
        };
    </script>
</body>
</html>
