<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brothers Squad - Terminal</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --card-inner: #040406;
            --text-main: #ffffff;
            --text-muted: #71717a;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --red-pure: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.7);
            --red-glow-soft: rgba(239, 68, 68, 0.35);
            --red-bg: rgba(239, 68, 68, 0.07);
        }

        body.light-theme {
            --bg-color: #f4f4f5;
            --card-inner: #ffffff;
            --text-main: #09090b;
            --text-muted: #71717a;
            --btn-bg: #09090b;
            --btn-text: #ffffff;
            --red-bg: rgba(239, 68, 68, 0.05);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; min-height: 100dvh; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; position: relative;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* ---------------------------------------------------- */
        /* 1. BEHIND-THE-CARD SLASHING LIGHT LINES (1s DURATION)*/
        /* ---------------------------------------------------- */
        #slashesContainer {
            position: fixed; inset: 0; pointer-events: none; z-index: 1;
            overflow: hidden; will-change: transform;
        }

        .slash-beam {
            position: absolute; top: -140%; height: 150vh; width: 3px;
            opacity: 0; transform: translate3d(0, 0, 0) rotate(14deg);
            will-change: transform, opacity;
        }

        /* 5 Staggered Line Positions */
        .s1 { left: 18%; width: 2px; }
        .s2 { left: 34%; width: 4px; }
        .s3 { left: 52%; width: 3px; }
        .s4 { left: 70%; width: 5px; }
        .s5 { left: 86%; width: 2px; }

        /* Light Mode Slashes (White Neon Laser Rays) */
        .anim-light .slash-beam {
            background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.95) 50%, #ffffff 80%, transparent 100%);
            box-shadow: 0 0 15px #ffffff, 0 0 35px rgba(255, 255, 255, 0.85);
            animation: slashSweep 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Dark Mode Slashes (Obsidian Darkness Rays) */
        .anim-dark .slash-beam {
            background: linear-gradient(180deg, transparent 0%, rgba(30, 30, 45, 0.95) 50%, #000000 80%, transparent 100%);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 50px rgba(0, 0, 0, 0.8);
            animation: slashSweep 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .anim-light .s1, .anim-dark .s1 { animation-delay: 0.00s; }
        .anim-light .s2, .anim-dark .s2 { animation-delay: 0.08s; }
        .anim-light .s3, .anim-dark .s3 { animation-delay: 0.03s; }
        .anim-light .s4, .anim-dark .s4 { animation-delay: 0.12s; }
        .anim-light .s5, .anim-dark .s5 { animation-delay: 0.06s; }

        @keyframes slashSweep {
            0% { transform: translate3d(0, -100%, 0) rotate(14deg); opacity: 0; }
            30% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate3d(0, 140%, 0) rotate(14deg); opacity: 0; }
        }

        /* Theme Toggle Button */
        .theme-toggle-btn {
            position: fixed; top: 18px; right: 18px; z-index: 100;
            background: rgba(125, 125, 125, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main); padding: 7px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px;
            backdrop-filter: blur(10px); transition: 0.2s;
        }
        .theme-toggle-btn:active { transform: scale(0.94); }

        /* ---------------------------------------------------- */
        /* 2. INTRO (STATIC FADE IN / FADE OUT)                 */
        /* ---------------------------------------------------- */
        #intro {
            position: fixed; inset: 0; background: #000000; z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .hud-center-group { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; }
        .handless-clock-wrap { position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; }
        .handless-clock { width: 100%; height: 100%; transform: rotate(-90deg); }
        .clock-outer-track { fill: none; stroke: rgba(255, 255, 255, 0.12); stroke-width: 1.5; }
        .clock-ticks { fill: none; stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 6 12; animation: rotateClock 3s linear infinite; transform-origin: 40px 40px; }
        .clock-inner-ring { fill: none; stroke: rgba(255, 255, 255, 0.35); stroke-width: 1; stroke-dasharray: 3 6; animation: rotateCounter 4s linear infinite; transform-origin: 40px 40px; }
        .clock-core-dot { position: absolute; width: 7px; height: 7px; background: #fff; border-radius: 50%; box-shadow: 0 0 14px #ffffff; animation: corePulse 1s ease-in-out infinite alternate; }

        @keyframes rotateClock { to { transform: rotate(360deg); } }
        @keyframes rotateCounter { to { transform: rotate(-360deg); } }
        @keyframes corePulse { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(1.15); opacity: 1; } }

        .thermo-container { display: flex; align-items: center; gap: 6px; height: 58px; }
        .thermo-scale { display: flex; flex-direction: column; justify-content: space-between; height: 100%; font-size: 8px; font-weight: 800; color: rgba(255, 255, 255, 0.4); font-family: 'Orbitron', sans-serif; }
        .thermo-tube { width: 7px; height: 100%; background: rgba(255, 255, 255, 0.08); border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.2); position: relative; overflow: hidden; padding: 1px; }
        .thermo-mercury { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: #ffffff; border-radius: 4px; box-shadow: 0 0 10px #ffffff; animation: fillThermo 1.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
        @keyframes fillThermo { 0% { height: 0%; } 100% { height: 92%; } }

        .racing-title {
            font-family: 'Orbitron', sans-serif; font-weight: 900;
            font-size: clamp(1.8rem, 6.5vw, 2.5rem); text-transform: uppercase; color: #ffffff;
            letter-spacing: 2px; text-shadow: 0 0 14px rgba(255, 255, 255, 0.85);
            animation: staticFade 2.2s ease-in-out forwards;
        }

        @keyframes staticFade {
            0% { opacity: 0; }
            35%, 70% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ---------------------------------------------------- */
        /* 3. MAIN CARD WITH RUNNING WHITE NEON BORDER          */
        /* ---------------------------------------------------- */
        .screen {
            display: none; width: 100%; max-width: 420px; padding: 20px;
            z-index: 10; position: relative;
            animation: screenFade 0.35s ease forwards;
        }
        .screen.active { display: block; }
        @keyframes screenFade { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .login-card {
            position: relative;
            border-radius: 26px; padding: 34px 24px;
            text-align: center; overflow: hidden;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.12), 0 0 70px rgba(255, 255, 255, 0.04);
            z-index: 10;
        }

        /* Running White Fade Neon Light All Sides */
        .login-card::before {
            content: '';
            position: absolute; inset: -50%;
            background: conic-gradient(from 0deg, transparent 0%, transparent 65%, rgba(255, 255, 255, 0.95) 85%, transparent 100%);
            animation: rotateNeonBorder 3.5s linear infinite;
            z-index: -2;
            will-change: transform;
        }

        .login-card::after {
            content: '';
            position: absolute; inset: 1.5px;
            background: var(--card-inner);
            border-radius: 24.5px;
            z-index: -1;
            transition: background 0.3s ease;
        }

        @keyframes rotateNeonBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .badge {
            display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--text-main); background: rgba(125, 125, 125, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2); padding: 5px 14px; border-radius: 20px; margin-bottom: 15px;
        }

        h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; color: var(--text-main); }
        .group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 7px; }

        /* ---------------------------------------------------- */
        /* 4. RED INPUT FIELDS & SPREADING RED GLOW             */
        /* ---------------------------------------------------- */
        .user-in {
            width: 100%; padding: 14px 16px; 
            background: var(--red-bg);
            border: 1.5px solid var(--red-pure); 
            border-radius: 13px; color: var(--text-main);
            font-size: 0.95rem; font-weight: 600; outline: none; 
            transition: all 0.25s ease;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.15);
        }
        .user-in:focus {
            border-color: #ff3355;
            background: rgba(239, 68, 68, 0.12);
            box-shadow: 0 0 22px var(--red-glow), 0 0 40px var(--red-glow-soft), inset 0 0 10px rgba(239, 68, 68, 0.2);
            transform: scale(1.01);
        }

        .pin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
        .pin {
            width: 100%; height: 50px; 
            background: var(--red-bg);
            border: 1.5px solid var(--red-pure); 
            border-radius: 12px;
            text-align: center; font-size: 1.4rem; font-weight: 800; color: var(--text-main); 
            outline: none; transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.15);
        }
        .pin:focus {
            border-color: #ff3355;
            background: rgba(239, 68, 68, 0.12);
            box-shadow: 0 0 22px var(--red-glow), 0 0 40px var(--red-glow-soft);
            transform: translateY(-2px) scale(1.03);
        }

        .err { color: var(--red-pure); font-size: 11.5px; font-weight: 700; margin-top: 8px; display: none; }

        .btn-access {
            width: 100%; padding: 14px; margin-top: 10px;
            background: var(--btn-bg); color: var(--btn-text);
            border: none; border-radius: 13px; font-weight: 900; font-size: 0.95rem;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.35); transition: 0.2s;
        }
        .btn-access:active { transform: scale(0.98); }

        /* ---------------------------------------------------- */
        /* 5. GLOWING SUCCESS CHECKMARK                         */
        /* ---------------------------------------------------- */
        .check-wrapper { text-align: center; padding: 45px 15px; }
        .glowing-check-box {
            width: 85px; height: 85px; border-radius: 50%;
            background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.6); 
            animation: checkPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes checkPop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .check-svg { width: 44px; height: 44px; stroke: #10b981; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

    <!-- Behind-The-Card Slashes (5 Rays) -->
    <div id="slashesContainer">
        <div class="slash-beam s1"></div>
        <div class="slash-beam s2"></div>
        <div class="slash-beam s3"></div>
        <div class="slash-beam s4"></div>
        <div class="slash-beam s5"></div>
    </div>

    <!-- Theme Switch Button -->
    <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span> <span id="themeLabel">Light Mode</span>
    </button>

    <!-- 1. INTRO (STATIC TEXT, PURE FADE) -->
    <div id="intro">
        <div class="hud-center-group">
            <div class="handless-clock-wrap">
                <svg class="handless-clock" viewBox="0 0 80 80">
                    <circle class="clock-outer-track" cx="40" cy="40" r="36" />
                    <circle class="clock-ticks" cx="40" cy="40" r="36" />
                    <circle class="clock-inner-ring" cx="40" cy="40" r="26" />
                </svg>
                <div class="clock-core-dot"></div>
            </div>

            <div class="thermo-container">
                <div class="thermo-scale">
                    <span>100</span>
                    <span>50</span>
                    <span>0</span>
                </div>
                <div class="thermo-tube">
                    <div class="thermo-mercury"></div>
                </div>
            </div>
        </div>

        <h1 class="racing-title">Brothers Squad</h1>
    </div>

    <!-- 2. LOGIN CARD (WITH RUNNING NEON BORDER & RED INPUTS) -->
    <div class="screen active" id="screenLogin">
        <div class="login-card">
            <div class="badge">Terminal Access</div>
            <h2>Sign In</h2>

            <div class="group">
                <label>Username</label>
                <input type="text" id="user" class="user-in" placeholder="Username" autocomplete="off">
            </div>

            <div class="group">
                <label>Password (4-Digit PIN)</label>
                <div class="pin-grid">
                    <input type="text" class="pin" maxlength="1" inputmode="numeric">
                    <input type="text" class="pin" maxlength="1" inputmode="numeric">
                    <input type="text" class="pin" maxlength="1" inputmode="numeric">
                    <input type="text" class="pin" maxlength="1" inputmode="numeric">
                </div>
                <div class="err" id="errMsg">Invalid credentials.</div>
            </div>

            <button class="btn-access" id="btnAccess">Access Terminal</button>
        </div>
    </div>

    <!-- 3. GLOWING SUCCESS CHECKMARK (FINAL) -->
    <div class="screen" id="screenSuccess">
        <div class="login-card check-wrapper">
            <div class="glowing-check-box">
                <svg class="check-svg" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h2>Access Granted</h2>
            <p style="color:var(--text-muted); font-size:0.92rem;" id="welcomeMsg">Welcome to Brothers Squad.</p>
        </div>
    </div>

    <script>
        // 1. Telegram WebApp Init
        let tgUser = null;
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser?.username || tgUser?.first_name) {
                document.getElementById('user').value = tgUser.username || tgUser.first_name;
            }
        }

        // 2. Intro Synchronization (2.3s)
        window.addEventListener('DOMContentLoaded', () => {
            const intro = document.getElementById('intro');
            setTimeout(() => {
                intro.style.opacity = '0';
                setTimeout(() => intro.remove(), 500);
            }, 2300);
        });

        // 3. Smooth Behind-The-Card Slashes Animation (~1s)
        let isLight = false;
        function toggleTheme() {
            const slashes = document.getElementById('slashesContainer');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');

            slashes.className = '';
            // Reflow trigger for clean 60fps restart
            void slashes.offsetWidth;
            slashes.className = isLight ? 'anim-dark' : 'anim-light';

            setTimeout(() => {
                isLight = !isLight;
                if (isLight) {
                    document.body.classList.add('light-theme');
                    icon.innerText = '🌙';
                    label.innerText = 'Dark Mode';
                } else {
                    document.body.classList.remove('light-theme');
                    icon.innerText = '☀️';
                    label.innerText = 'Light Mode';
                }
            }, 380);

            setTimeout(() => {
                slashes.className = '';
            }, 1100);

            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }

        // 4. PIN Logic
        const pins = document.querySelectorAll('.pin');
        const pinVals = Array(4).fill('');

        pins.forEach((input, i) => {
            input.oninput = (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '').slice(-1);
                pinVals[i] = val;
                input.value = val;
                if (val) {
                    setTimeout(() => { if (pinVals[i]) input.value = '•'; }, 180);
                    if (i < 3) pins[i + 1].focus();
                }
            };
            input.onkeydown = (e) => {
                if (e.key === 'Backspace' && !input.value && i > 0) {
                    pins[i - 1].focus();
                    pins[i - 1].value = '';
                    pinVals[i - 1] = '';
                }
            };
        });

        // 5. Authenticate & Show Checkmark
        document.getElementById('btnAccess').onclick = () => {
            const u = document.getElementById('user').value.trim();
            const p = pinVals.join('');
            const err = document.getElementById('errMsg');

            const isValid = u.toLowerCase() === 'saad' || (tgUser?.username && u.toLowerCase() === tgUser.username.toLowerCase()) || (tgUser && u.length > 0);

            if (isValid && p === '1234') {
                err.style.display = 'none';
                const displayName = tgUser ? (tgUser.first_name || tgUser.username) : u;
                document.getElementById('welcomeMsg').innerText = `Welcome back, ${displayName}.`;

                document.getElementById('screenLogin').classList.remove('active');
                document.getElementById('screenSuccess').classList.add('active');

                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
            } else {
                err.innerText = p.length < 4 ? 'Please enter all 4 digits.' : 'Invalid credentials. (PIN: 1234)';
                err.style.display = 'block';
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                }
            }
        };
    </script>
</body>
</html>
